<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Interior Designer Company</title>
</head>

<body>
    
    <div class="container">
        <!-- header section  start -->
        <header>
            <div class="logo">
                <a href="index.html"><img src="logo/header-logo.png" alt="logo"></a>
            </div>
            <nav>
                <a href="index.html">Homepage</a>
                <a href="#">About Us</a>
                <a href="#">Explore Work</a>
                <a href="#">Trending</a>
                <a href="#">Contact Us</a>
            </nav>
        </header>
        <!-- header section end  -->

        <!-- First/banner section start -->
        <section id="first_section">
            <main>
                <h3>WE PROVIDE EVERYTHING</h3>
                <h1><span>INTERIOR</span> DESIGNER</h1>
                <a href="#">Discover More</a>
            </main>
        </section>
        <!-- first section end  -->

        <!-- second/search section start  -->
         <section id="second_section">
            <div class="main_box">
                <!-- <div>
                    <h3>Search Work by Title</h3>
                </div>
                <div>
                    <h3>Search Work by Title</h3>
                </div>
                <div>
                    <h3>Search Work by Title</h3>
                </div>
                <div>
                    <h3>Search Work by Title</h3>
                </div> -->
                <form>              
                    <label for="search_box">
                        <h3>Search Work by Title</h3>
                        <input type="text" class="search_box" placeholder="Type any work title...">
                    </label>
                    <label for="search_box">
                        <h3>Choose Category</h3>
                        <select>
                            <option value="">Choose category</option>
                            <option value="">Interior Design</option>
                            <option value="">Exterior Design</option>
                            <option value="">New Ideas</option>
                            <option value="">Trendy Design</option>
                        </select>
                    </label>
                    <label for="search_box">
                        <h3>Price Range</h3>
                        <select>
                            <option value="">Choose price</option>
                            <option value="">$100 - $250</option>
                            <option value="">$250 - $500</option>
                            <option value="">$500 - $1000</option>
                            <option value="">$1000+</option>
                        </select>
                    </label>
                    <label for="search_box">
                        <h3>Pick a Plan</h3>
                        <select>
                            <option value="">Choose plan</option>
                            <option value="">Standerd</option>
                            <option value="">Professional</option>
                            <option value="">Golden</option>
                            <option value="">Premium</option>
                        </select>
                    </label>
                </form>
                <button class="search_button">Search Now</button>           
            </div>
         </section>

         <!-- second section end  -->
    </div>
</body>
</html>
